<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-container">
            <h2>Hola, bienvenido</h2>
            <p class="login-subtitle">Inicia sesión para acceder a tu espacio de trabajo</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Escribe tu nombre de usuario..." required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="login-submit-btn">Continuar</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
