<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Clone - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor que centra todo en pantalla con el degradado -->
    <div class="login-container">
        
        <!-- Tarjeta blanca/beige central -->
        <div class="login-box">
            <h1>Hola, bienvenido</h1>
            <p>Inicia sesión para acceder a tu espacio de trabajo</p>
            
            <form id="login-form">
                <!-- Grupo Usuario -->
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Escribe tu nombre de usuario" required>
                </div>
                
                <!-- Grupo Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <!-- Botón de envío -->
                <button type="submit" class="btn-submit">Continuar</button>
            </form>
        </div>

    </div>

    <!-- Vinculación del JavaScript (si ya tienes lógica de redirección) -->
    <script src="app.js"></script>
</body>
</html>
