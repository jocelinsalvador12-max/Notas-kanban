<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tablero Kanban - Estilo Notion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚QuickNote</h1>
        <p>Gestiona tus proyectos de forma ágil</p>
    </header>

    <div class="add-task-container">
        <input type="text" id="task-input" placeholder="Escribe alguna tarea aquí..." autocomplete="off">
        <button id="add-task-btn">＋ Añadir tarea</button>
    </div>

    <main class="kanban-board">
        
        <section class="kanban-column" id="to-do">
            <h2>📌 Por Hacer</h2>
            <div class="cards-container dropzone">
        
                <div class="kanban-card" draggable="true">
                    <p>Aprender las bases de Git con GitHub Desktop 🚀</p>
                    <button class="delete-card-btn">×</button>
                </div>

            </div>
        </section> 

        <section class="kanban-column" id="in-progress">
            <h2>⚡ En Progreso</h2>
            <div class="cards-container dropzone">
                </div>
        </section>

        <section class="kanban-column" id="done">
            <h2>✅ Terminado</h2>
            <div class="cards-container dropzone">
                </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
